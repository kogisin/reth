name: report.yml

on:
  schedule:
    - cron: "7 7 * * *"    # ежедневно 07:07 UTC
  workflow_dispatch: {}

permissions:
  contents: write

env:
  UPSTREAM: paradigmxyz/reth    # поменяй при необходимости
  BRANCH: main

jobs:
  sync-and-check:
    runs-on: ubuntu-latest

    steps:
      # ---------- 1) SYNC ----------
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.BRANCH }}

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream & fetch
        run: |
          git remote add upstream "https://github.com/${{ env.UPSTREAM }}.git" || true
          git fetch --prune upstream
          git fetch --prune origin

      - name: Sync from upstream (FF or merge)
        id: sync
        shell: bash
        run: |
          set -e
          git checkout "${BRANCH}"
          MODE="none"

          if git merge-base --is-ancestor HEAD "upstream/${BRANCH}"; then
            BEFORE=$(git rev-parse HEAD)
            git merge --ff-only "upstream/${BRANCH}"
            AFTER=$(git rev-parse HEAD)
            if [ "$BEFORE" != "$AFTER" ]; then
              MODE="fast-forward"
              git push origin "HEAD:${BRANCH}"
            fi
          else
            set +e
            git merge --no-edit "upstream/${BRANCH}"
            RC=$?
            set -e
            if [ $RC -eq 0 ]; then
              MODE="merge-commit"
              git push origin "HEAD:${BRANCH}"
            else
              MODE="conflict-skip"
              git merge --abort || true
            fi
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

      - name: Prepare paths
        id: paths
        run: |
          echo "json=$GITHUB_WORKSPACE/lychee.json" >> "$GITHUB_OUTPUT"
          echo "report=$GITHUB_WORKSPACE/report.txt" >> "$GITHUB_OUTPUT"

      # ---------- 2) Lychee с JSON (build из source) ----------
      - name: Install lychee (from source with JSON support)
        id: lychee_build
        continue-on-error: true
        run: |
          set -e
          sudo apt-get update -y
          sudo apt-get install -y jq curl rustc cargo
          # feature "json" включает формат JSON в бинарнике
          cargo install lychee --locked --force --features json
          lychee --version || true

      # ---------- fallback: предсобранный бинарь ----------
      - name: Install lychee (fallback binary)
        if: steps.lychee_build.outcome != 'success'
        run: |
          set -e
          sudo apt-get install -y jq curl file
          REL_JSON=$(curl -s https://api.github.com/repos/lycheeverse/lychee/releases/latest)
          ASSET=$(echo "$REL_JSON" | jq -r '.assets[] | select(.name|test("x86_64-unknown-linux-gnu.*\\.tar\\.gz$")) | .browser_download_url' | head -n1)
          curl -L "$ASSET" -o lychee.tgz
          tar -xzf lychee.tgz
          chmod +x lychee
          sudo mv lychee /usr/local/bin/lychee
          lychee --version || true

      # ---------- 3) Запуск проверки с жёсткими фильтрами ----------
      - name: Run lychee link checker
        id: lychee
        shell: bash
        run: |
          set +e
          JSON="${{ steps.paths.outputs.json }}"
          CACHE="$RUNNER_TEMP/lychee-cache-$(date +%s).db"

          lychee \
            --no-progress \
            --no-git-ignore \
            --include-fragments \
            --cache "$CACHE" \
            --max-concurrency 16 \
            --timeout 30 \
            --retry-wait-time 3 \
            --max-retries 3 \
            --header "User-Agent: GitHubAction-lychee" \
            --accept 200,429 \
            --exclude "http://localhost(:[0-9]+)?/" \
            --exclude "enode://*" \
            --exclude "http://127.0.0.1(:[0-9]+)?/" \
            --verbose \
            --format json \
            --output "$JSON" \
            . \
            > lychee.log 2>&1

          echo "Lychee output preview (first 60 lines):"
          head -n 60 lychee.log || true

          if [ -s "$JSON" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
          set -e

      # ---------- 4) Строим человекочитаемый отчёт (только fail_map) ----------
      - name: Build report
        id: build
        shell: bash
        run: |
          JSON="${{ steps.paths.outputs.json }}"
          REPORT="${{ steps.paths.outputs.report }}"
          : > "$REPORT"

          if [ ! -s "$JSON" ]; then
            echo "Lychee JSON is missing or empty" > "$REPORT"
            echo "broken=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ERR=$(jq '(.fail_map // {}) | to_entries | map(.value | length) | add // 0' "$JSON")
          echo "broken=$ERR" >> "$GITHUB_OUTPUT"

          jq -r '
            (.fail_map // {}) as $m
            | [ $m | to_entries[] | . as $e
                | $e.value[] | {
                    src: (.source.file // .source // "unknown"),
                    url: $e.key,
                    st:  (.status // .code // .response?.status // "ERR"),
                    err: (.error // .reason // .message // "")
                  }
              ] as $rows
            | if ($rows|length)==0 then
                "No broken links."
              else
                ( $rows
                  | group_by(.src)[]
                  | "Errors in " + (.[0].src) + ":\n"
                    + ( map("[" + (.st|tostring) + "] " + .url + (if .err=="" then "" else " | " + .err end))
                        | unique | join("\n"))
                    + "\n"
                )
              end
          ' "$JSON" > "$REPORT"

      # ---------- 5) Summary + артефакты + Telegram ----------
      - name: Publish GitHub Summary
        shell: bash
        run: |
          REPORT="${{ steps.paths.outputs.report }}"
          {
            echo "### Broken Links (lychee)"
            echo
            echo "\`Sync mode:\` **${{ steps.sync.outputs.mode }}**"
            echo
            echo '```text'
            cat "$REPORT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lychee-report
          path: |
            ${{ steps.paths.outputs.json }}
            ${{ steps.paths.outputs.report }}
            lychee.log

      - name: Send Telegram
        if: always()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}
          BROKEN:   ${{ steps.build.outputs.broken }}
          MODE:     ${{ steps.sync.outputs.mode }}
        shell: bash
        run: |
          set +e
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          REPORT="${{ steps.paths.outputs.report }}"
          MSG="$GITHUB_WORKSPACE/message.txt"
          : > "$MSG"

          {
            echo "Broken Links Report"
            echo "Broken: ${BROKEN:-0}"
            echo "Sync mode: ${MODE:-none}"
            echo "Run: ${RUN_URL}"
            echo
          } >> "$MSG"

          if [ -f "$REPORT" ]; then
            head -c 3500 "$REPORT" >> "$MSG"
          else
            echo "(no report generated)" >> "$MSG"
          fi

          curl -sS -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -H "content-type: application/json" \
            -d "$(jq -Rs --arg chat "${ADMIN_ID}" '{chat_id:$chat, text:. , disable_web_page_preview:true}' < "$MSG")"

          if [ -f "$REPORT" ]; then
            curl -sS -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendDocument" \
              -F "chat_id=${ADMIN_ID}" \
              -F "document=@${REPORT}" \
              -F "caption=Full broken-links report"
          fi
