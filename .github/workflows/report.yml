name: report.yml

on:
  schedule:
    - cron: "7 7 * * *"           # ежедневно 07:07 UTC
  workflow_dispatch: {}

permissions:
  contents: write                 # пуш в форк

env:
  UPSTREAM: paradigmxyz/reth      # ← замени на фактический апстрим, если другой
  BRANCH: main

jobs:
  sync-and-check:
    runs-on: ubuntu-latest

    steps:
      # ---------- 1) SYNC (fast-forward only) ----------
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.BRANCH }}

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream & fetch
        run: |
          git remote add upstream "https://github.com/${{ env.UPSTREAM }}.git" || true
          git fetch upstream --prune
          git fetch origin  --prune

      - name: Fast-forward from upstream
        id: sync
        shell: bash
        run: |
          set -e
          git checkout "${BRANCH}"
          if git merge-base --is-ancestor HEAD "upstream/${BRANCH}"; then
            BEFORE=$(git rev-parse HEAD)
            git merge --ff-only "upstream/${BRANCH}"
            AFTER=$(git rev-parse HEAD)
            if [ "$BEFORE" != "$AFTER" ]; then
              git push origin "HEAD:${BRANCH}"
              echo "synced=true" >> $GITHUB_OUTPUT
            else
              echo "synced=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "synced=false" >> $GITHUB_OUTPUT
            echo "Fast-forward not possible; skipping auto-sync."
          fi

      # ---------- 2) LYCHEE ----------
      - name: Re-checkout repo (post-sync)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.BRANCH }}

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Run lychee (JSON)
        id: lychee
        continue-on-error: true
        uses: lycheeverse/lychee-action@v2.2.0
        with:
          args: >-
            --no-progress
            --accept 200,429
            --exclude "http://localhost(:[0-9]+)?/"
            --exclude "enode://*"
            --exclude "http://127.0.0.1(:[0-9]+)?/"
            --verbose
            --format json
            "**/*.md" "**/*.mdx" "**/*.tsx" "**/*.rs" "**/*.ts"
          output: lychee.json

      # ---------- 3) Сборка отчёта как в UI ----------
      - name: Build “UI-like” report (summary + errors per input)
        id: build
        shell: bash
        run: |
          OUT="lychee.json"
          : > report.txt
          : > summary.json

          # Если отчёт не создан — завершаем минимумом, чтобы TG и Summary не вели себя как “ОК”
          if [ ! -s "$OUT" ]; then
            echo '{ "total": 0, "successful": 0, "errors": 0, "excludes": 0, "cached": 0, "unknown": 0, "unsupported": 0, "redirects": 0, "timeouts": 0 }' > summary.json
            echo "Lychee did not produce report (outcome=${{ steps.lychee.outcome }})" > report.txt
            echo "broken=0" >> $GITHUB_OUTPUT
          else
            # попытка достать счетчики из разных возможных полей (lychee менял схему в версиях)
            TOTAL=$(jq '(.stats.total // .total // 0)' "$OUT")
            OK=$(jq '(.stats.success // .successful // (.ok // 0))' "$OUT")
            ERR=$(jq '((.stats.errors // .errors), (.fail_map | length // 0)) | select(.!=null) | . ' "$OUT")
            EXCL=$(jq '(.stats.excludes // .excludes // (.exclude_map | length // 0) // 0)' "$OUT")
            CACHED=$(jq '(.stats.cached // .cached // 0)' "$OUT")
            UNK=$(jq '(.stats.unknown // .unknown // 0)' "$OUT")
            UNSUP=$(jq '(.stats.unsupported // .unsupported // 0)' "$OUT")
            REDIR=$(jq '(.stats.redirects // .redirects // 0)' "$OUT")
            TIMEO=$(jq '(.stats.timeouts // .timeouts // 0)' "$OUT")

            # если ERR пустой — ставим 0
            if [ -z "$ERR" ]; then ERR=0; fi

            jq -n --argjson total "$TOTAL" --argjson ok "$OK" --argjson err "$ERR" \
                  --argjson exc "$EXCL" --argjson cached "$CACHED" --argjson unk "$UNK" \
                  --argjson uns "$UNSUP" --argjson red "$REDIR" --argjson tmo "$TIMEO" \
              '{ total:$total, successful:$ok, errors:$err, excludes:$exc, cached:$cached, unknown:$unk, unsupported:$uns, redirects:$red, timeouts:$tmo }' \
              > summary.json

            echo "broken=$ERR" >> $GITHUB_OUTPUT

            # Ошибки по файлам: Errors in <file>:\n[status] URL | reason
            jq -r '
              (.fail_map // {}) as $m
              | reduce ($m|to_entries[]) as $e ([];
                  . + ( $e.value
                        | map({
                            src: (.source.file // .source // "unknown"),
                            st:  (.status // .code // .response?.status // .checks?[0]?.status // "ERR"),
                            err: (.error // .reason // .message // ""),
                            url: $e.key
                          })
                      )
                )
              | if length==0 then "No broken links." else
                  (
                    "Summary\n" +
                    ( "  total:        " + ((input | .total)|tostring) + "\n" ) +
                    ( "  successful:   " + ((input | .successful)|tostring) + "\n" ) +
                    ( "  errors:       " + ((input | .errors)|tostring) + "\n" ) +
                    ( "  excludes:     " + ((input | .excludes)|tostring) + "\n" ) +
                    ( "  cached:       " + ((input | .cached)|tostring) + "\n" ) +
                    ( "  unknown:      " + ((input | .unknown)|tostring) + "\n" ) +
                    ( "  unsupported:  " + ((input | .unsupported)|tostring) + "\n" ) +
                    ( "  redirects:    " + ((input | .redirects)|tostring) + "\n" ) +
                    ( "  timeouts:     " + ((input | .timeouts)|tostring) + "\n\n" )
                  ) as $hdr
                  | group_by(.src)[]
                  | "Errors in " + (.[0].src) + ":\n"
                    + (map("[" + ( .st|tostring ) + "] " + .url + (if .err=="" then "" else " | " + .err end))
                       | unique | join("\n"))
                    + "\n"
                  , $hdr
              ' --slurpfile summary summary.json "$OUT" \
              | awk 'BEGIN{hdr=""} { if($0 ~ /^Summary$/){hdr=$0; getline; s=$0; for(i=1;i<9;i++){getline; s=s"\n"$0} print hdr"\n"s; next } print }' \
              > report.txt
          fi

          echo "---- preview (first 120 lines) ----"
          sed -n '1,120p' report.txt || true

      # ---------- 4) Публикация отчёта в GitHub Summary ----------
      - name: Publish GitHub job summary (Markdown)
        shell: bash
        run: |
          echo "### Link Check Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`Upstream synced:\` **${{ steps.sync.outputs.synced || 'false' }}**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          cat report.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lychee-report
          path: |
            lychee.json
            summary.json
            report.txt

      # ---------- 5) Telegram (тот же отчёт: коротко в сообщении + полный файлом) ----------
      - name: Send Telegram
        if: always()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}
          SYNCED:   ${{ steps.sync.outputs.synced }}
        shell: bash
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          # заголовок
          {
            echo "Link Check Report"
            echo "Upstream synced: ${SYNCED:-false}"
            echo "Run: ${RUN_URL}"
            echo
          } > message.txt

          # добавим первые ~3000 символов отчёта (чтобы точно влезло в 4096)
          head -c 3000 report.txt >> message.txt

          # Отправляем текст как raw-string (с реальными переносами)
          curl -sS -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -H 'content-type: application/json' \
            -d "$(jq -Rs --arg chat "${ADMIN_ID}" '{chat_id:$chat, text:. , disable_web_page_preview:true}' < message.txt)"

          # Прикрепим ПОЛНЫЙ отчёт файлом
          curl -sS -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendDocument" \
            -F "chat_id=${ADMIN_ID}" \
            -F "document=@report.txt" \
            -F "caption=Full link check report"
