name: report.yml

on:
  schedule:
    - cron: "7 7 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

env:
  UPSTREAM: paradigmxyz/reth   # поменяй при необходимости
  BRANCH: main

jobs:
  sync-and-check:
    runs-on: ubuntu-latest

    steps:
      # ---------- 1) SYNC (fast-forward only) ----------
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.BRANCH }}

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream & fetch
        run: |
          git remote add upstream "https://github.com/${{ env.UPSTREAM }}.git" || true
          git fetch upstream --prune
          git fetch origin  --prune

      - name: Fast-forward from upstream
        id: sync
        shell: bash
        run: |
          set -e
          git checkout "${BRANCH}"
          if git merge-base --is-ancestor HEAD "upstream/${BRANCH}"; then
            BEFORE=$(git rev-parse HEAD)
            git merge --ff-only "upstream/${BRANCH}"
            AFTER=$(git rev-parse HEAD)
            if [ "$BEFORE" != "$AFTER" ]; then
              git push origin "HEAD:${BRANCH}"
              echo "synced=true" >> $GITHUB_OUTPUT
            else
              echo "synced=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "synced=false" >> $GITHUB_OUTPUT
            echo "Fast-forward not possible; skipping auto-sync."
          fi

      # ---------- 2) LYCHEE ----------
      - name: Re-checkout repo (post-sync)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.BRANCH }}

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Run lychee (JSON)
        id: lychee
        continue-on-error: true
        uses: lycheeverse/lychee-action@v2.2.0
        with:
          args: >-
            --no-progress
            --accept 200,429
            --exclude "http://localhost(:[0-9]+)?/"
            --exclude "enode://*"
            --exclude "http://127.0.0.1(:[0-9]+)?/"
            --verbose
            --format json
            "**/*.md" "**/*.mdx" "**/*.tsx" "**/*.rs" "**/*.ts"
          output: lychee.json

      # ---------- 3) Построение отчёта ТОЛЬКО из fail_map ----------
      - name: Build report (only broken links grouped by file)
        id: build
        shell: bash
        run: |
          OUT="lychee.json"
          : > report.txt

          if [ ! -s "$OUT" ]; then
            echo "Lychee did not produce report (outcome=${{ steps.lychee.outcome }})" > report.txt
            echo "broken=0" >> $GITHUB_OUTPUT
          else
            # количество битых ссылок = сумма длин массивов в fail_map
            ERR=$(jq '(.fail_map // {}) | to_entries | map(.value | length) | add // 0' "$OUT")
            echo "broken=$ERR" >> $GITHUB_OUTPUT

            # плоская таблица только из fail_map: {src,url,st,err}
            jq -r '
              (.fail_map // {}) as $m
              | [ $m | to_entries[] | . as $e
                  | $e.value[] | {
                      src: (.source.file // .source // "unknown"),
                      url: $e.key,
                      st:  (.status // .code // .response?.status // .checks?[0]?.status // "ERR"),
                      err: (.error // .reason // .message // "")
                    }
                ] as $rows
              | if ($rows|length)==0 then
                  "No broken links."
                else
                  ( $rows
                    | group_by(.src)[]
                    | "Errors in " + (.[0].src) + ":\n"
                      + ( map("[" + (.st|tostring) + "] " + .url + (if .err=="" then "" else " | " + .err end))
                          | unique | join("\n"))
                      + "\n"
                  )
                end
            ' "$OUT" > report.txt
          fi

          echo "---- preview ----"
          sed -n '1,120p' report.txt || true

      # ---------- 4) GitHub Summary (как в UI: список ошибок per file) ----------
      - name: Publish GitHub job summary
        shell: bash
        run: |
          echo "### Link Check — Broken Links Only" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`Upstream synced:\` **${{ steps.sync.outputs.synced || 'false' }}**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          cat report.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lychee-report
          path: |
            lychee.json
            report.txt

      # ---------- 5) Telegram: текст + полный отчёт файлом ----------
      - name: Send Telegram
        if: always()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}
          BROKEN:   ${{ steps.build.outputs.broken }}
          SYNCED:   ${{ steps.sync.outputs.synced }}
        shell: bash
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          {
            echo "Link Check — Broken Links Only"
            echo "Broken: ${BROKEN:-0}"
            echo "Upstream synced: ${SYNCED:-false}"
            echo "Run: ${RUN_URL}"
            echo
          } > message.txt

          # первые ~3000 символов текста для sendMessage (лимит телеги ~4096)
          head -c 3000 report.txt >> message.txt

          curl -sS -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -H 'content-type: application/json' \
            -d "$(jq -Rs --arg chat "${ADMIN_ID}" '{chat_id:$chat, text:. , disable_web_page_preview:true}' < message.txt)"

          # полный отчёт файлом
          curl -sS -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendDocument" \
            -F "chat_id=${ADMIN_ID}" \
            -F "document=@report.txt" \
            -F "caption=Full broken-links report"
