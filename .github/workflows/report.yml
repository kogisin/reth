name: Daily Sync -> Link Check -> TG (admin only)

on:
  schedule:
    - cron: "7 7 * * *"        # ежедневно 07:07 UTC
  workflow_dispatch: {}         # ручной запуск

permissions:
  contents: write               # пуш в форк

env:
  # Укажи реальный апстрим, если другой:
  UPSTREAM: paradigmxyz/reth
  BRANCH: main

jobs:
  sync-and-check:
    runs-on: ubuntu-latest

    steps:
      # ===== 1) СИНХРОНИЗАЦИЯ ФОРКА (FAST-FORWARD, без переписывания истории) =====
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.BRANCH }}

      - name: Configure git bot identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream & fetch
        run: |
          git remote add upstream "https://github.com/${{ env.UPSTREAM }}.git" || true
          git fetch upstream --prune
          git fetch origin  --prune

      - name: Fast-forward merge from upstream (no history rewrite)
        id: sync
        shell: bash
        run: |
          set -e
          git checkout "${BRANCH}"

          # Можно ли fast-forward до upstream/BRANCH?
          if git merge-base --is-ancestor HEAD "upstream/${BRANCH}"; then
            BEFORE=$(git rev-parse HEAD)
            git merge --ff-only "upstream/${BRANCH}"
            AFTER=$(git rev-parse HEAD)
            if [ "$BEFORE" != "$AFTER" ]; then
              git push origin "HEAD:${BRANCH}"
              echo "synced=true" >> $GITHUB_OUTPUT
            else
              echo "synced=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "synced=false" >> $GITHUB_OUTPUT
            echo "Fast-forward not possible (fork ahead). Skipping auto-sync."
          fi

      # ===== 2) ПРОВЕРКА ССЫЛОК (LYCHEE) =====
      - name: Re-checkout repo (post-sync)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.BRANCH }}

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Run Lychee link checker
        id: lychee
        continue-on-error: true          # не валим job; разберёмся в следующем шаге
        uses: lycheeverse/lychee-action@v2.2.0
        with:
          # Важно: не указываем --output в args. Используем input "output".
          args: >-
            --no-progress
            --accept 200,429
            --exclude "http://localhost(:[0-9]+)?/"
            --exclude "enode://*"
            --exclude "http://127.0.0.1(:[0-9]+)?/"
            --verbose
            --format json
            "**/*.md" "**/*.mdx" "**/*.tsx" "**/*.rs" "**/*.ts"
          output: lychee.json

      - name: Build TG-style report (group by source file)
        id: extract
        shell: bash
        run: |
          OUT="lychee.json"
          if [ ! -s "$OUT" ]; then
            echo "Lychee did not produce report (outcome=${{ steps.lychee.outcome }})"
            : > tg_report.txt
            echo "count=0" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Уникальные битые URL
          jq -r '(.fail_map // {}) | to_entries[] | .key' "$OUT" | sort -u > bad_links.txt || true
          COUNT=$(wc -l < bad_links.txt | tr -d ' ')
          echo "count=$COUNT" >> $GITHUB_OUTPUT

          # Сводка «как в UI»: Errors in <file>:\n[status] URL | reason
          jq -r '
            (.fail_map // {}) as $m
            | reduce ($m|to_entries[]) as $e ([];
                . + ( $e.value
                      | map({
                          src: (.source.file // .source // "unknown"),
                          st:  (.status // .code // .response?.status // .checks?[0]?.status // "ERR"),
                          err: (.error // .reason // .message // ""),
                          url: $e.key
                        })
                    )
              )
            | group_by(.src)[]
            | "Errors in " + (.[0].src) + ":\n"
              + (map("[" + ( .st|tostring ) + "] " + .url + (if .err=="" then "" else " | " + .err end))
                 | unique | join("\n"))
              + "\n"
          ' "$OUT" > tg_report.txt || true

          # Ограничим размер сообщения для Telegram (~4096 символов)
          head -c 3500 tg_report.txt > tg_report.txt.trim && mv tg_report.txt.trim tg_report.txt

          echo "---- preview ----"
          sed -n '1,80p' tg_report.txt || true

      - name: Upload artifacts (optional)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lychee-report
          path: |
            lychee.json
            bad_links.txt
            tg_report.txt

      # ===== 3) ОТПРАВКА ОТЧЁТА В ТЕЛЕГРАМ (ТОЛЬКО АДМИНУ) =====
      - name: Send Telegram report to admin only
        if: always()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}   # твой личный chat_id
          COUNT:   ${{ steps.extract.outputs.count }}
          SYNCED:  ${{ steps.sync.outputs.synced }}
        shell: bash
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          OUTCOME="${{ steps.lychee.outcome }}"   # success | failure | cancelled

          if [ -s tg_report.txt ]; then
            HEADER="🟥 Link check: ${OUTCOME}\nBroken: ${COUNT}\nUpstream synced: ${SYNCED:-false}\nRun: ${RUN_URL}\n\n"
            TEXT="$HEADER$(cat tg_report.txt)"
          else
            if [ "$OUTCOME" = "success" ]; then
              TEXT="✅ Link check: success\nAll links OK\nUpstream synced: ${SYNCED:-false}\nRun: ${RUN_URL}"
            else
              TEXT="🟧 Link check: ${OUTCOME}\n(no report generated)\nUpstream synced: ${SYNCED:-false}\nRun: ${RUN_URL}"
            fi
          fi

          curl -sS -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -H 'content-type: application/json' \
            -d "$(jq -n --arg chat "${ADMIN_ID}" --arg txt "${TEXT}" \
                  '{chat_id:$chat, text:$txt, disable_web_page_preview:true }')"
