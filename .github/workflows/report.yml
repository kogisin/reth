name: report.yml

on:
  schedule:
    - cron: "7 7 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

env:
  UPSTREAM: paradigmxyz/reth
  BRANCH: main

jobs:
  sync-and-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.BRANCH }}

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream & fetch
        run: |
          git remote add upstream "https://github.com/${{ env.UPSTREAM }}.git" || true
          git fetch upstream --prune
          git fetch origin  --prune

      - name: Fast-forward from upstream
        id: sync
        shell: bash
        run: |
          set -e
          git checkout "${BRANCH}"
          if git merge-base --is-ancestor HEAD "upstream/${BRANCH}"; then
            BEFORE=$(git rev-parse HEAD)
            git merge --ff-only "upstream/${BRANCH}"
            AFTER=$(git rev-parse HEAD)
            if [ "$BEFORE" != "$AFTER" ]; then
              git push origin "HEAD:${BRANCH}"
              echo "synced=true" >> $GITHUB_OUTPUT
            else
              echo "synced=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "synced=false" >> $GITHUB_OUTPUT
            echo "Fast-forward not possible; skipping auto-sync."
          fi

      - name: Install tools (jq + lychee)
        shell: bash
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y jq curl
          VER=$(curl -s https://api.github.com/repos/lycheeverse/lychee/releases/latest | jq -r .tag_name)
          curl -L "https://github.com/lycheeverse/lychee/releases/download/${VER}/lychee-${VER}-x86_64-unknown-linux-gnu.tar.gz" -o lychee.tgz
          tar -xzf lychee.tgz
          sudo mv lychee /usr/local/bin/lychee
          lychee --version

      - name: Run lychee -> lychee.json
        id: run_lychee
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          lychee \
            --no-progress \
            --accept 200,429 \
            --exclude "http://localhost(:[0-9]+)?/" \
            --exclude "enode://*" \
            --exclude "http://127.0.0.1(:[0-9]+)?/" \
            --verbose \
            --format json \
            "**/*.md" "**/*.mdx" "**/*.tsx" "**/*.rs" "**/*.ts" \
            > "$GITHUB_WORKSPACE/lychee.json"
          jq 'keys' "$GITHUB_WORKSPACE/lychee.json" || true

      - name: Build report (only broken links, grouped by file)
        id: build
        shell: bash
        run: |
          OUT="$GITHUB_WORKSPACE/lychee.json"
          REPORT="$GITHUB_WORKSPACE/report.txt"
          : > "$REPORT"

          if [ ! -s "$OUT" ]; then
            echo "Lychee JSON is missing (outcome=${{ steps.run_lychee.outcome }})" > "$REPORT"
            echo "broken=0" >> $GITHUB_OUTPUT
            exit 0
          fi

          ERR=$(jq '(.fail_map // {}) | to_entries | map(.value | length) | add // 0' "$OUT")
          echo "broken=$ERR" >> $GITHUB_OUTPUT

          jq -r '
            (.fail_map // {}) as $m
            | [ $m | to_entries[] | . as $e
                | $e.value[] | {
                    src: (.source.file // .source // "unknown"),
                    url: $e.key,
                    st:  (.status // .code // .response?.status // .checks?[0]?.status // "ERR"),
                    err: (.error // .reason // .message // "")
                  }
              ] as $rows
            | if ($rows|length)==0 then
                "No broken links."
              else
                ( $rows
                  | group_by(.src)[]
                  | "Errors in " + (.[0].src) + ":\n"
                    + ( map("[" + (.st|tostring) + "] " + .url + (if .err=="" then "" else " | " + .err end))
                        | unique | join("\n"))
                    + "\n"
                )
              end
          ' "$OUT" > "$REPORT"

          echo "---- REPORT PREVIEW ----"
          sed -n '1,120p' "$REPORT" || true

      - name: Publish Job Summary (broken only)
        shell: bash
        run: |
          REPORT="$GITHUB_WORKSPACE/report.txt"
          : > $GITHUB_STEP_SUMMARY
          echo "### Broken Links (lychee)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`Upstream synced:\` **${{ steps.sync.outputs.synced || 'false' }}**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          cat "$REPORT" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lychee-report
          path: |
            ${{ github.workspace }}/lychee.json
            ${{ github.workspace }}/report.txt

      # -------------- FIXED STEP ---------------
      - name: Send Telegram
        if: always()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}
          BROKEN:   ${{ steps.build.outputs.broken }}
          SYNCED:   ${{ steps.sync.outputs.synced }}
        shell: bash
        run: |
          set +e
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          REPORT="$GITHUB_WORKSPACE/report.txt"

          echo "Workspace: $GITHUB_WORKSPACE"
          echo "Files:"
          ls -la "$GITHUB_WORKSPACE" || true

          : > "$GITHUB_WORKSPACE/message.txt"
          {
            echo "Broken Links Report"
            echo "Broken: ${BROKEN:-0}"
            echo "Upstream synced: ${SYNCED:-false}"
            echo "Run: ${RUN_URL}"
            echo
          } >> "$GITHUB_WORKSPACE/message.txt"

          if [ -f "$REPORT" ]; then
            head -c 3000 "$REPORT" >> "$GITHUB_WORKSPACE/message.txt"
          else
            echo "(no report generated)" >> "$GITHUB_WORKSPACE/message.txt"
          fi

          curl -sS -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -H 'content-type: application/json' \
            -d "$(jq -Rs --arg chat "${ADMIN_ID}" '{chat_id:$chat, text:. , disable_web_page_preview:true}' < "$GITHUB_WORKSPACE/message.txt")"

          if [ -f "$REPORT" ]; then
            curl -sS -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendDocument" \
              -F "chat_id=${ADMIN_ID}" \
              -F "document=@${REPORT}" \
              -F "caption=Full broken-links report"
          fi
